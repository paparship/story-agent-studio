name: Publish workbench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_GAME_URL: ${{ vars.VITE_GAME_URL }}
      - name: Fetch separately licensed demo runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-runtime-v1 --pattern game-runtime.zip --dir /tmp
          unzip -q /tmp/game-runtime.zip -d dist/game
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
